name: CI

# swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci); .ci/README.md lists
# what runs when. `.ci/swift-ci local` runs the same checks on a developer's machine.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# The manifest's -warn-long-* budget for this package's own jobs (swift-ci exports the same for its checks).
env:
  AD_TYPECHECK_BUDGET_MS: "250"

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@c930444a6f6f462ddce3fbad7df9f8e2acc3e04b # swift-ci c930444
    permissions:
      contents: write # reusable publish permission; this package publishes no archives

  changes:
    name: Plan · Detect IPv6 Validator Changes
    needs: ci
    # Path gate for the sanitizer pass. The one unsafe boundary in the library is the IPv6 literal
    # path, which calls the platform C library (`inet_pton`/`inet_ntop`) in `URLValidator.swift`.
    # A PR touching the validator should trip ASan/UBSan too; other PRs skip the slow pass.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      validator: ${{ steps.filter.outputs.validator }}
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Plan · Classify Changed Paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            validator:
              - 'Sources/URLBuilder/URLValidator.swift'

  api-stability:
    name: Compatibility · Public API
    needs: ci
    # Catch accidental public-API removals/changes in PRs (additions are fine). Compares the PR head
    # against the PR's base commit on main.
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup · Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
      - name: Setup · Install Swift 6.4.1
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.4.1"
      - name: Compatibility · Diagnose Breaking Changes
        run: swift package diagnose-api-breaking-changes "${{ github.event.pull_request.base.sha }}"

  platforms:
    name: Compatibility · ${{ matrix.platform }}
    needs: ci
    # Cross-platform compile is broad but costly: run it on main / on demand, not on every PR
    # (the macOS leg in the reusable `quality` job already covers compilation for PRs).
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    # Use the installed SwiftPM for manifest resolution; Xcode embeds an older SwiftPM.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: iOS, sdk: iphoneos, triple: arm64-apple-ios18.0 }
          - { platform: tvOS, sdk: appletvos, triple: arm64-apple-tvos18.0 }
          - { platform: "watchOS (arm64_32)", sdk: watchos, triple: arm64_32-apple-watchos11.0 }
          - { platform: "watchOS (arm64)", sdk: watchos, triple: arm64-apple-watchos11.0 }
          - { platform: visionOS, sdk: xros, triple: arm64-apple-xros2.0 }
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup · Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
      - name: Setup · Install Swift 6.4.1
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.4.1"
      - name: Cache · Restore Platform Build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: platform-spm-${{ runner.os }}-${{ matrix.platform }}-6.4.1-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**') }}
          restore-keys: |
            platform-spm-${{ runner.os }}-${{ matrix.platform }}-6.4.1-${{ hashFiles('Package.swift') }}-
            platform-spm-${{ runner.os }}-${{ matrix.platform }}-6.4.1-
      - name: Compatibility · Build for ${{ matrix.platform }}
        run: |
          sdk_path="$(xcrun --sdk '${{ matrix.sdk }}' --show-sdk-path)"
          swift build --sdk "$sdk_path" --triple '${{ matrix.triple }}' --target URLBuilder

  generator-reproducibility:
    name: Generated Sources · Public Suffix List
    needs: ci
    # `Sources/URLBuilder/PublicSuffix.swift` is generated at build time from the vendored IANA +
    # Mozilla inputs and is NOT committed. Generation must be deterministic: regenerating from the
    # same inputs must produce a byte-identical file. Run the standalone generator twice and diff.
    runs-on: macos-26
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup · Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
      - name: Setup · Install Swift 6.4.1
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.4.1"
      - name: Cache · Restore SwiftPM
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-gen-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/PublicSuffixGeneratorCore/**', 'Sources/public-suffix-generator/**') }}
          restore-keys: |
            spm-${{ runner.os }}-gen-${{ hashFiles('Package.swift') }}-
            spm-${{ runner.os }}-gen-
      - name: Generated Sources · Build Generator
        run: swift build --product public-suffix-generator
      - name: Generated Sources · Regenerate & Compare
        run: |
          set -euo pipefail
          BIN="$(swift build --product public-suffix-generator --show-bin-path)/public-suffix-generator"
          IANA="docs/References/TLDs/tlds-alpha-by-domain.txt"
          PSL="docs/References/TLDs/public_suffix_list.dat"
          "$BIN" "$IANA" "$PSL" /tmp/PublicSuffix.1.swift
          "$BIN" "$IANA" "$PSL" /tmp/PublicSuffix.2.swift
          diff -u /tmp/PublicSuffix.1.swift /tmp/PublicSuffix.2.swift
          echo "Generator output is reproducible."

  downstream-resolvability:
    name: Compatibility · Downstream Resolution
    needs: ci
    # Locks the round-1 dependency-safety fix: the shipped `URLBuilder` product carries no unsafe
    # build flags, so a downstream package can depend on it *by URL* (source control) and resolve
    # the graph. A throwaway consumer pins this repo by `file://` URL at the commit under test and
    # runs `swift package resolve`. URLBuilder is pinned by revision (itself unversioned), so its
    # branch-pinned AemiJSON dependency resolves cleanly; switch the consumer to `from:` once both
    # URLBuilder and AemiJSON publish versioned tags.
    runs-on: macos-26
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup · Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
      - name: Setup · Install Swift 6.4.1
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.4.1"
      - name: Compatibility · Resolve a URL Consumer
        run: |
          set -euo pipefail
          REPO="$PWD"
          SHA="$(git rev-parse HEAD)"
          CONSUMER="$(mktemp -d)/Consumer"
          mkdir -p "$CONSUMER/Sources/Consumer"
          cat > "$CONSUMER/Package.swift" <<EOF
          // swift-tools-version: 6.3
          import PackageDescription
          let package = Package(
            name: "Consumer",
            dependencies: [.package(url: "file://$REPO", revision: "$SHA")],
            targets: [
              .executableTarget(
                name: "Consumer",
                dependencies: [.product(name: "URLBuilder", package: "URLBuilder")])
            ]
          )
          EOF
          printf 'import URLBuilder\n@main struct Consumer { static func main() {} }\n' \
            > "$CONSUMER/Sources/Consumer/main.swift"
          cd "$CONSUMER"
          swift package resolve
          echo "URLBuilder resolves as a URL-based dependency."

  sanitizers:
    name: Sanitizers · Address & Undefined · macOS
    needs: [ci, changes]
    # ASan/UBSan rebuild the whole graph under instrumentation, so run them on main / on demand —
    # and, additionally, on any PR that touches the IPv6 C-interop in `URLValidator.swift` (gated by
    # the `changes` job), the one place an OOB / use-after-free could be introduced. The full test
    # suite (IPv6 literals, host/PSL/path parsing) is the stress input. TSan is omitted: the library
    # is value-typed, immutable, and fully Sendable, so there is no shared mutable state to race.
    # Package-unique (not the reusable's sanitizer leg): path-gated, and combines address+undefined
    # in a single run.
    if: github.event_name != 'pull_request' || needs.changes.outputs.validator == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup · Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
      - name: Setup · Install Swift 6.4.1
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.4.1"
      - name: Setup · Report Swift Version
        run: swift --version
      - name: Cache · Restore SwiftPM
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # TOOLCHAINS (exported by setup-swift above) is part of the key: a `.build` produced by a
          # DIFFERENT snapshot fails clang dependency scanning when restored, so cross-toolchain
          # fallbacks are excluded (the stale-incremental class the family tracks as #14).
          key: spm-${{ runner.os }}-san-6.4.1-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**', 'Tests/**', 'Plugins/**') }}
          restore-keys: |
            spm-${{ runner.os }}-san-6.4.1-${{ hashFiles('Package.swift') }}-
            spm-${{ runner.os }}-san-6.4.1-
      - name: Sanitizers · Run Tests
        # Match the reusable workflow's development-tooling configuration.
        run: URLBUILDER_DEV=1 swift test --sanitize=address --sanitize=undefined

  docs:
    name: Documentation · Validate
    needs: ci
    runs-on: macos-26
    env:
      URLBUILDER_DEV: "1"
    steps:
      - name: Setup · Check Out Sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup · Select Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' | sort -V | tail -1)"
      - name: Setup · Install Swift 6.4.1
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: "6.4.1"
      - name: Cache · Restore SwiftPM
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-docs-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**') }}
          restore-keys: |
            spm-${{ runner.os }}-docs-${{ hashFiles('Package.swift') }}-
            spm-${{ runner.os }}-docs-
      - name: Documentation · Build & Validate Site
        run: |
          swift package --allow-writing-to-directory "$PWD/_site" \
            generate-documentation --target URLBuilder \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path URLBuilder \
            --output-path "$PWD/_site"
      - name: Documentation · Add Root Redirect
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=documentation/urlbuilder/">
          <link rel="canonical" href="documentation/urlbuilder/">
          <title>URLBuilder</title>
          <a href="documentation/urlbuilder/">URLBuilder documentation</a>
          HTML
      - name: Artifacts · Upload Documentation
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  docs-publish:
    name: Documentation · Publish
    # Deploys the site the validation job built: one build, and the github-pages environment (main only) is
    # entered by main's runs alone, so a pull request never asks for it.
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Serialize Pages deploys without cancelling an in-flight publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Documentation · Deploy Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
