# The COMMON legs (lint/gate, build & test on macOS + Linux) route through the shared reusable
# workflow. The package-UNIQUE jobs run alongside it: an API-stability check, a cross-platform
# compile matrix, the public-suffix generator reproducibility check, a downstream URL-resolvability
# check, a path-gated ASan/UBSan pass over the IPv6 C-interop, and the DocC build + Pages deploy.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "CONTRIBUTING.md", "LICENSE", ".gitignore", ".githooks/**"]
  pull_request:
    paths-ignore: ["README.md", "CONTRIBUTING.md", "LICENSE", ".gitignore", ".githooks/**"]
  # On-demand trigger for the slow platform / sanitizer / docs jobs.
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on branches/PRs; never cancel an in-progress run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Type-check-budget calibration for the manifest's env-tunable -warn-long-* flags on the BESPOKE
# jobs below (the reusable swift-quality workflow exports its own copy for the common legs):
# 250 ms absorbs shared-runner wall-time noise; local builds keep the strict 100 ms default.
env:
  AD_TYPECHECK_BUDGET_MS: "250"

jobs:
  quality:
    # Full-adopt of the reusable workflow for the COMMON gate + build/test (macOS + Linux, debug +
    # release, coverage on the debug macOS leg). URLBuilder depends on the first-party siblings ADJSON
    # and ADFoundation (resolved from branch: main — Package.swift lines 51 & 58, in the always-on
    # dependency array), so the resolution-dependent jobs stay gated on AD_SWIFT_SIBLINGS_PUBLISHED;
    # the file-based gates (format/metrics/drift) always run. This replaces the bespoke macOS gate and
    # the advisory `nightly-main-jammy` Linux lane with the canonical dated-nightly Linux matrix.
    # Sanitizers and docs are NOT enabled here: the package-unique `sanitizers` job below is path-gated
    # to the IPv6 validator and combines address+undefined in one run, and the `docs` job below also
    # DEPLOYS to GitHub Pages — neither is covered by the reusable's (unconditional, generate-only) legs.
    uses: g-cqd/ADBuildTools/.github/workflows/swift-quality.yml@v1
    with:
      # arcleak and dolly GATE (arcleak measured 0 findings family-wide; dolly runs the token
      # pass against .dolly-baseline.json, so only NEW clones fail). deadwood is report-only —
      # its syntax-mode dataflow cannot see writes through closures or mutating methods.
      enable-static-analysis: true
      dev-env-var: URLBUILDER_DEV
      enable-sanitizers: true
      sanitizers: "address thread"
      enable-coverage: true
      requires-published-siblings: true

  changes:
    name: Detect IPv6 / validator changes
    needs: quality
    # Path gate for the sanitizer pass. The one unsafe boundary in the library is the IPv6 literal
    # path, which calls the platform C library (`inet_pton`/`inet_ntop`) in `URLValidator.swift`.
    # A PR touching the validator should trip ASan/UBSan too; other PRs skip the slow pass.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      validator: ${{ steps.filter.outputs.validator }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            validator:
              - 'Sources/URLBuilder/URLValidator.swift'

  api-stability:
    name: API breaking changes
    needs: quality
    # Catch accidental public-API removals/changes in PRs (additions are fine). Compares the PR head
    # against the PR's base commit on main.
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Diagnose API breaking changes vs base
        run: swift package diagnose-api-breaking-changes "${{ github.event.pull_request.base.sha }}"

  platforms:
    name: Build (${{ matrix.platform }})
    needs: quality
    # Cross-platform compile is broad but costly: run it on main / on demand, not on every PR
    # (the macOS leg in the reusable `quality` job already covers compilation for PRs).
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    # ADVISORY until an Xcode with SwiftPM >= 6.4 ships on runner images: xcodebuild resolves
    # packages with ITS OWN embedded SwiftPM (Xcode 26.6 = Swift 6.3.x), which cannot parse this
    # package's swift-tools-version 6.4 manifest — the installed 6.4 snapshot (TOOLCHAINS) swaps
    # compilers but not xcodebuild's package resolution, so every leg dies at "Could not resolve
    # package dependencies". Structural: the matrix has never been able to pass on this image
    # generation. Re-promote when Xcode 27 lands on runner images.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    steps:
      - uses: actions/checkout@v6
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Cache SwiftPM + DerivedData
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .derivedData
          key: spm-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('Package.swift') }}-
            spm-${{ runner.os }}-${{ matrix.platform }}-
      - name: Build for ${{ matrix.platform }}
        run: >-
          xcodebuild build
          -scheme URLBuilder
          -destination "generic/platform=${{ matrix.platform }}"
          -derivedDataPath .derivedData
          -skipMacroValidation
          -skipPackagePluginValidation

  generator-reproducibility:
    name: Public-suffix generator reproducibility
    needs: quality
    # `Sources/URLBuilder/PublicSuffix.swift` is generated at build time from the vendored IANA +
    # Mozilla inputs and is NOT committed. Generation must be deterministic: regenerating from the
    # same inputs must produce a byte-identical file. Run the standalone generator twice and diff.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-gen-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/PublicSuffixGeneratorCore/**', 'Sources/public-suffix-generator/**') }}
          restore-keys: |
            spm-${{ runner.os }}-gen-${{ hashFiles('Package.swift') }}-
            spm-${{ runner.os }}-gen-
      - name: Build the generator
        run: swift build --product public-suffix-generator
      - name: Regenerate twice and assert byte-identical output
        run: |
          set -euo pipefail
          BIN="$(swift build --product public-suffix-generator --show-bin-path)/public-suffix-generator"
          IANA="docs/References/TLDs/tlds-alpha-by-domain.txt"
          PSL="docs/References/TLDs/public_suffix_list.dat"
          "$BIN" "$IANA" "$PSL" /tmp/PublicSuffix.1.swift
          "$BIN" "$IANA" "$PSL" /tmp/PublicSuffix.2.swift
          diff -u /tmp/PublicSuffix.1.swift /tmp/PublicSuffix.2.swift
          echo "Generator output is reproducible."

  downstream-resolvability:
    name: Downstream resolvability (URL dependency)
    needs: quality
    # Locks the round-1 dependency-safety fix: the shipped `URLBuilder` product carries no unsafe
    # build flags, so a downstream package can depend on it *by URL* (source control) and resolve
    # the graph. A throwaway consumer pins this repo by `file://` URL at the commit under test and
    # runs `swift package resolve`. URLBuilder is pinned by revision (itself unversioned), so its
    # branch-pinned ADJSON dependency resolves cleanly; switch the consumer to `from:` once both
    # URLBuilder and ADJSON publish versioned tags.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Resolve a throwaway consumer that depends on URLBuilder by URL
        run: |
          set -euo pipefail
          REPO="$PWD"
          SHA="$(git rev-parse HEAD)"
          CONSUMER="$(mktemp -d)/Consumer"
          mkdir -p "$CONSUMER/Sources/Consumer"
          cat > "$CONSUMER/Package.swift" <<EOF
          // swift-tools-version: 6.3
          import PackageDescription
          let package = Package(
            name: "Consumer",
            dependencies: [.package(url: "file://$REPO", revision: "$SHA")],
            targets: [
              .executableTarget(
                name: "Consumer",
                dependencies: [.product(name: "URLBuilder", package: "URLBuilder")])
            ]
          )
          EOF
          printf 'import URLBuilder\n@main struct Consumer { static func main() {} }\n' \
            > "$CONSUMER/Sources/Consumer/main.swift"
          cd "$CONSUMER"
          swift package resolve
          echo "URLBuilder resolves as a URL-based dependency."

  sanitizers:
    name: Sanitize (address + undefined)
    needs: [quality, changes]
    # ASan/UBSan rebuild the whole graph under instrumentation, so run them on main / on demand —
    # and, additionally, on any PR that touches the IPv6 C-interop in `URLValidator.swift` (gated by
    # the `changes` job), the one place an OOB / use-after-free could be introduced. The full test
    # suite (IPv6 literals, host/PSL/path parsing) is the stress input. TSan is omitted: the library
    # is value-typed, immutable, and fully Sendable, so there is no shared mutable state to race.
    # Package-unique (not the reusable's sanitizer leg): path-gated, and combines address+undefined
    # in a single run.
    if: github.event_name != 'pull_request' || needs.changes.outputs.validator == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Show toolchain
        run: swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          # TOOLCHAINS (exported by setup-swift above) is part of the key: a `.build` produced by a
          # DIFFERENT snapshot fails clang dependency scanning when restored, so cross-toolchain
          # fallbacks are excluded (the stale-incremental class the family tracks as #14).
          key: spm-${{ runner.os }}-san-${{ env.TOOLCHAINS }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**', 'Tests/**', 'Plugins/**') }}
          restore-keys: |
            spm-${{ runner.os }}-san-${{ env.TOOLCHAINS }}-${{ hashFiles('Package.swift') }}-
            spm-${{ runner.os }}-san-${{ env.TOOLCHAINS }}-
      - name: Test under address + undefined sanitizers
        # URLBUILDER_DEV wires the dev-only ADTestKit (from the ADFoundation umbrella) into the test
        # target; without it the suite fails dependency scanning on `import ADTestKit`. The reusable
        # workflow sets this via its `dev-env-var` input, but this bespoke leg must set it itself.
        run: URLBUILDER_DEV=1 swift test --sanitize=address --sanitize=undefined

  docs:
    name: Build & deploy docs (Pages)
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Serialize Pages deploys without cancelling an in-flight publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      URLBUILDER_DEV: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install Swift 6.4 dev toolchain (no hosted macOS image ships 6.4)
        uses: g-cqd/ADBuildTools/.github/actions/setup-swift@v1
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-docs-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**') }}
          restore-keys: |
            spm-${{ runner.os }}-docs-${{ hashFiles('Package.swift') }}-
            spm-${{ runner.os }}-docs-
      - name: Build DocC site (static hosting)
        run: |
          swift package --allow-writing-to-directory "$PWD/_site" \
            generate-documentation --target URLBuilder \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path URLBuilder \
            --output-path "$PWD/_site"
      - name: Add root redirect to the documentation landing page
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=documentation/urlbuilder/">
          <link rel="canonical" href="documentation/urlbuilder/">
          <title>URLBuilder</title>
          <a href="documentation/urlbuilder/">URLBuilder documentation</a>
          HTML
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
